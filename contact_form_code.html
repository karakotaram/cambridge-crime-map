<!-- CONTACT FORM CODE TO ADD TO LIVE SITE -->
<!-- Add this CSS to the <style> section: -->

<style>
.contact-section {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2.5rem;
    margin: 3rem 0;
    color: white;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.contact-section h2 {
    font-size: 2rem;
    margin-bottom: 1rem;
    text-align: center;
    color: white;
}

.contact-section > p {
    text-align: center;
    margin-bottom: 2rem;
    opacity: 0.9;
    font-size: 1.1rem;
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    font-weight: 600;
    color: white;
    font-size: 0.95rem;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: rgba(255,255,255,0.6);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
}

.contact-form button {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 1rem;
}

.contact-form button:hover {
    background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
}
</style>

<!-- Add this HTML right before the footer div: -->

<div class="contact-section">
    <h2>Questions or Comments?</h2>
    <p>Have feedback about this analysis or suggestions for improvements? Get in touch!</p>
    
    <form name="contact" method="POST" data-netlify="true" class="contact-form">
        <input type="hidden" name="form-name" value="contact">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject:</label>
            <select id="subject" name="subject" required>
                <option value="">Select a topic...</option>
                <option value="Bug Report">Bug Report</option>
                <option value="Feature Request">Feature Request</option>
                <option value="Data Question">Data Question</option>
                <option value="General Feedback">General Feedback</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required placeholder="Your message..."></textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
</div>

<!-- INSTRUCTIONS:
1. Add the CSS styles to your existing <style> section
2. Add the HTML div right before the <div class="footer"> element
